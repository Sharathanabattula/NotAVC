name: Publish due posts

# Vercel's Hobby plan caps cron at once per day, which is useless for
# scheduled posting. GitHub Actions runs on a 5-minute cadence for free, so
# it drives the publisher and Vercel's own daily cron stays as a backstop.
#
# Note: GitHub's scheduler is best-effort. Under load a run can be delayed
# by several minutes or skipped entirely, so treat post times as approximate
# rather than exact. The endpoint is idempotent — it claims each post before
# publishing, so a late run or an overlapping one cannot double-post.

on:
  schedule:
    - cron: "*/5 * * * *"
  # Lets you force a publish run from the Actions tab
  workflow_dispatch:

# A slow run must never overlap itself into a pile-up
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the publisher
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL or CRON_SECRET repository secret is not set"
            exit 1
          fi

          response=$(curl -sS --max-time 120 \
            -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/publish")

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Publisher returned HTTP $status"
            exit 1
          fi
