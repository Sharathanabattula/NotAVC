<!-- @dsCard group="Thumbnails" viewport="1000x420" name="YouTube Thumbnails" subtitle="Bold split-color, high-contrast — 16:9" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--canvas);font-family:var(--font-body)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Thumbnail.jsx"></script>
<script type="text/babel">
function App() {
  const [i, setI] = React.useState(0);
  const T = [
    { kicker: 'COMPANY TEARDOWN', title: 'Why', highlight: 'Zepto will either IPO or die in 18 months', stat: '$5.2B', statLabel: 'VALUATION' },
    { kicker: 'FOUNDER STORY', title: 'The decision that nearly killed', highlight: 'Zerodha', stat: '0', statLabel: 'VC DOLLARS RAISED' },
    { kicker: 'MARKET MAP', title: "India's fintech funding just", highlight: 'cratered', stat: '-42%', statLabel: 'YoY 2026' },
  ];
  return (
    <div style={{ padding: 28, display: 'flex', flexDirection: 'column', gap: 18, alignItems: 'center' }}>
      <Thumbnail {...T[i]} />
      <div style={{ display: 'flex', gap: 8 }}>
        {T.map((_, idx) => <button key={idx} onClick={() => setI(idx)} style={{ width: 10, height: 10, borderRadius: '50%', border: 'none', cursor: 'pointer', background: idx === i ? 'var(--signal)' : '#ddd' }}></button>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
